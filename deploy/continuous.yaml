# Continuous report ingestion and bounded npm/PyPI static analysis.
# Uses the existing database, data volume and signing key. Runtime stays disabled.
listen: 0.0.0.0:8080
database_env: DATABASE_URL
operator_token_env: ZOLI_OPERATOR_TOKEN
runner_token_env: ZOLI_RUNNER_TOKEN
github_token_env: GITHUB_TOKEN
storage_dir: data/private
feed_dir: data/feed
signing_key: secrets/feed.key
rules_file: rules/rules.yaml
ingest_interval: 15m
discovery_interval: 1m
publish_interval: 1m

sources:
  - name: openssf-via-osv
    type: osv
    url: https://storage.googleapis.com/osv-vulnerabilities
    license: Apache-2.0
    trusted: true
    ecosystems: [PyPI, npm, crates.io, Maven]
  - name: github-malware
    type: github
    url: https://api.github.com/advisories
    license: CC-BY-4.0
    trusted: true

analysis:
  enabled: true
  runtime_enabled: false
  daily_bytes: 1073741824
  daily_runtime_jobs: 100
  runtime_concurrency: 1
  max_artifact_bytes: 20971520
  max_expanded_bytes: 104857600
  max_files: 10000
  runtime_timeout: 5m
  sandbox_runtime: runsc
  sandbox_trace_dir: /var/log/zoli-runsc
  sandbox_images: {}
  protected_packages:
    npm: [react, express, axios, lodash, typescript]
    pypi: [requests, numpy, pandas, flask, django]
  watchlist:
    npm: []
    pypi: []

api:
  requests_per_minute: 60
  keys_env: ZOLI_API_KEYS
