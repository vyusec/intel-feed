# Run the PostgreSQL lifecycle suite against a dedicated database on the host.
# See docs/operations.md; this service receives no operator or signing secrets.
services:
  validation:
    image: golang:1.26-bookworm
    working_dir: /src
    environment:
      ZOLI_TEST_DATABASE_URL: postgres://zoli:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/zoli_readiness_test?sslmode=disable
    volumes:
      - ./go.mod:/src/go.mod:ro
      - ./go.sum:/src/go.sum:ro
      - ./internal:/src/internal:ro
      - ./third_party:/src/third_party:ro
    command: [go, test, -buildvcs=false, -race, -count=1, -v, ./internal/store]
    depends_on:
      db: {condition: service_healthy}
