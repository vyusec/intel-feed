name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: zoli
          POSTGRES_PASSWORD: zoli-test-only
          POSTGRES_DB: zoli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zoli -d zoli_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
        env:
          ZOLI_TEST_DATABASE_URL: postgres://zoli:zoli-test-only@localhost:5432/zoli_test?sslmode=disable
      - run: go vet ./...
      - run: node --test testdata/sandbox/offline-lock.test.cjs
      - run: make build evaluate
      - run: docker build .
